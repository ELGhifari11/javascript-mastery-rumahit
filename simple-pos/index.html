<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koperasi Santri POS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="kepala">
        <div class="kepala-teks">
            <h1>Simple POS (Point Of Sales)</h1>
            <h2 id="pesanKasir" class="pesan"></h2>
        </div>
        <div class="identitas-kasir">
            <label for="namaKasir" class="label">Nama kasir</label>
            <input type="text" id="namaKasir" placeholder="contoh: Zahra">
            <button id="btnSimpanKasir">Simpan nama</button>
        </div>
    </header>

    <section class="kartu kartu-stats-top" id="bagianStatistik">
        <h2>Statistik Penjualan</h2>
        <div id="statistikContainer" class="daftar"></div>
    </section>

    <main class="konten">



        <section class="kartu" id="bagianProduk">
            <h2>Daftar Produk</h2>
            <div class="tombol-ganda">
                <button class="button-kontrol" id="btnOpenAddProduct">Add Product</button>
                <!-- <button class="button-kontrol" onclick="togglePopup('1')">+</button> -->
            </div>
            <div id="daftarProduk" class="daftar"></div>
        </section>

        <section class="kartu" id="bagianKeranjang">
            <h2>Keranjang Penjualan</h2>
            <div id="ringkasanKeranjang" class="daftar"></div>
            <p id="totalBelanja" class="total"></p>
            <div class="tombol-ganda">
                <button id="btnKosongkanKeranjang">Kosongkan</button>
                <!-- <button onclick="simpanRingkasan()">Simpan ringkasan</button> -->
            </div>
        </section>

        <section class="kartu" id="bagianPembayaran">
            <h2>Pembayaran</h2>
            <label for="namaPelanggan" class="label">Nama Pelanggan</label>
            <input type="text" id="namaPelanggan" placeholder="contoh: Rafi">
            <label for="metodeBayar" class="label">Metode Pembayaran</label>
            <select id="metodeBayar">
                <option value="Tunai">Tunai</option>
                <option value="QRIS">QRIS</option>
                <option value="Transfer Bank">Transfer Bank</option>
            </select>
            <div id="inputUangBayar">
                <label for="uangBayar" class="label">Uang diterima (Rp)</label>
                <input type="number" id="uangBayar" placeholder="contoh: 20000">
            </div>
            <button id="btnProsesPembayaran">Hitung kembalian</button>
            <p id="pesanPembayaran" class="pesan"></p>
        </section>

        <section class="kartu" id="bagianLog">
            <h2>Log Penjualan</h2>
            <div id="logFilters" class="filters-bar">
                <select id="filterKasir"></select>
                <select id="filterPelanggan"></select>
                <select id="filterMetode"></select>
                <input type="text" id="filterSearch" placeholder="Cari kasir/pelanggan/produk" />
                <button class="button-kontrol" id="filterReset">Reset</button>
            </div>
            <div id="logContainer" class="ringkasan ringkasan-log"></div>
        </section>


    </main>

    <footer class="kepala">
        <div class="kaki">
            <h2>💪 Paksa - Terbiasa - Bisa - Luarbiasa : Juara 🏆</h2>
        </div>
    </footer>


    <div id="popupModal1" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" data-target="1">&times;</span>
            <section>
                <h2>Add Product</h2>
                <br>
                <label for="productId">ID Produk</label>
                <input type="text" id="productId" placeholder="Masukkan ID produk" required />
                <br>
                <br>
                <label for="productName">Nama Produk</label>
                <input type="text" id="productName" placeholder="Masukkan nama produk" required />
                <br>
                <br>
                <label for="productPrice">Harga (Rp)</label>
                <input type="number" id="productPrice" placeholder="Masukkan harga produk" required />
                <br>
                <br>
                <button id="btnSubmitProduct">Submit</button>
            </section>
        </div>
    </div>



    <div id="notifModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" data-target="notif">&times;</span>
            <p id="notifMessage" class="pesan"></p>
        </div>
    </div>
    <div id="invoiceModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" data-target="invoice">&times;</span>
            <div id="invoiceContent" class="ringkasan"></div>
        </div>
    </div>
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" data-target="detail">&times;</span>
            <div id="detailContent" class="ringkasan"></div>
        </div>
    </div>
    <div id="toast" class="toast hidden"></div>

    
    <script type="module" src="main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>

</html>
